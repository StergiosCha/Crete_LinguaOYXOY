const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxYeuNfyHrAN8wPdopCHkVO_2YDCDaUVxcFKaQbPcb-k2eOVH--CdYAAmCbVbhjcu1g/exec';

// ----- Utility: submit results to Google Sheets -----
async function submitToSheets(results, demographics, experiment) {
  const rows = results.map((r, idx) => ({
    timestamp: r.timestamp,
    participant_id: demographics.participantId,
    experiment: experiment,
    age: demographics.age,
    gender: demographics.gender,
    education: demographics.education,
    native_speaker: demographics.nativeSpeaker,
    region: demographics.region,
    item_id: r.itemId,
    phenomenon: r.phenomenon,
    condition: r.condition,
    rating: r.rating,
    rt_ms: r.rt,
    item_order: idx + 1
  }));
  try {
    // Use text/plain to avoid CORS preflight (simple request)
    await fetch(SHEETS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ rows })
    });
    // With no-cors, response is opaque but data is sent
    return true;
  } catch (err) {
    console.error('Failed to submit to Sheets:', err);
    return false;
  }
}

// ----- Utility: seeded Fisher-Yates shuffle -----
function mulberry32(seed) {
  return function() {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + ch;
    hash |= 0;
  }
  return Math.abs(hash);
}

function shuffleArray(arr, seed) {
  const shuffled = [...arr];
  const rng = mulberry32(seed);
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

// ----- Utility: generate participant ID -----
function generateParticipantId() {
  const now = Date.now();
  const rand = Math.random().toString(36).substring(2, 8);
  return `P_${now}_${rand}`;
}

// ----- Utility: convert results to CSV -----
function resultsToCSV(results, demographics, experiment) {
  const headers = [
    'participant_id', 'experiment', 'age', 'gender', 'education',
    'native_speaker', 'region', 'item_id', 'phenomenon', 'condition',
    'rating', 'rt_ms', 'item_order', 'timestamp'
  ];
  const rows = [headers.join(',')];
  results.forEach((r, idx) => {
    const row = [
      demographics.participantId,
      experiment,
      demographics.age,
      `"${demographics.gender}"`,
      `"${demographics.education}"`,
      demographics.nativeSpeaker,
      `"${demographics.region}"`,
      r.itemId,
      r.phenomenon,
      r.condition,
      r.rating,
      r.rt,
      idx + 1,
      r.timestamp
    ];
    rows.push(row.join(','));
  });
  return rows.join('\n');
}

function downloadCSV(csvString, filename) {
  const blob = new Blob(['﻿' + csvString], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

            <p className="text-sm text-gray-600 mb-2 font-medium">Παράδειγμα χρωμάτων:</p>
            <p className="text-base">
              Ο <span className="idx-a">Γιάννης</span> είδε <span className="idx-a">τον εαυτό του</span> στον καθρέφτη.
            </p>
            <p className="text-xs text-gray-400 mt-2">
              <span className="legend-swatch" style={{background:'#E15759'}}></span> Κόκκινο = ίδιο πρόσωπο&ensp;
              <span className="legend-swatch" style={{background:'#4E79A7'}}></span> Μπλε = ίδιο πρόσωπο&ensp;
              <span className="legend-swatch" style={{background:'#59A14F'}}></span> Πράσινο = ίδιο πρόσωπο
            </p>
          </div>
        )}

        <div className="bg-blue-50 rounded-lg p-4 mb-6 text-sm text-blue-800">
          <strong>Σημαντικό:</strong> Θα ξεκινήσετε με μερικές προτάσεις εξάσκησης. Μετά θα ακολουθήσουν οι κύριες προτάσεις του πειράματος. Δεν μπορείτε να επιστρέψετε σε προηγούμενη πρόταση.
        </div>

        <button onClick={onContinue}
          className="w-full bg-blue-600 text-white rounded-lg py-3 font-semibold hover:bg-blue-700 transition">
          Ξεκινήστε την εξάσκηση
        </button>
      </div>
    </div>
  );
}

// ----- Practice Item Screen -----
function PracticeScreen({ items, experiment, onComplete }) {
  const [current, setCurrent] = useState(0);
  const [rating, setRating] = useState(null);
  const [showFeedback, setShowFeedback] = useState(false);

  const item = items[current];
  const isExpB = experiment === 'B';
  const lowLabel = isExpB ? '1 = αδύνατη' : '1 = αφύσικη';
  const highLabel = isExpB ? '7 = αποδεκτή' : '7 = φυσική';

  const handleRate = (val) => {
    setRating(val);
    setShowFeedback(true);
  };

  const handleNext = () => {
    if (current + 1 >= items.length) {
      onComplete();
    } else {
      setCurrent(c => c + 1);
      setRating(null);
      setShowFeedback(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="max-w-lg w-full bg-white rounded-2xl shadow-sm p-6 sm:p-8">
        <ProgressBar current={current + 1} total={items.length} label="Εξάσκηση" />

        <div className="mb-2 text-xs text-gray-400 uppercase tracking-wide text-center">Εξάσκηση</div>

        <SentenceDisplay sentence={item.sentence} context={item.context} isExpB={isExpB} />

        <RatingScale value={rating} onChange={handleRate} lowLabel={lowLabel} highLabel={highLabel} />

        {showFeedback && (
          <div className="mt-6 fade-in">
            <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4 text-sm text-yellow-800">
              {item.feedback}
            </div>
            <button onClick={handleNext}
              className="w-full bg-blue-600 text-white rounded-lg py-3 font-semibold hover:bg-blue-700 transition mt-4">
              {current + 1 >= items.length ? 'Ξεκινήστε το πείραμα' : 'Επόμενη πρόταση'}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ----- Main Trial Screen -----
function TrialScreen({ items, experiment, demographics, onComplete }) {
  const [current, setCurrent] = useState(0);
  const [results, setResults] = useState([]);
  const [rating, setRating] = useState(null);
  const [itemStartTime, setItemStartTime] = useState(Date.now());
  const [transitioning, setTransitioning] = useState(false);

  const item = items[current];
  const isExpB = experiment === 'B';
  const lowLabel = isExpB ? '1 = αδύνατη' : '1 = αφύσικη';
  const highLabel = isExpB ? '7 = αποδεκτή' : '7 = φυσική';

  // Reset start time when item changes
  useEffect(() => {
    setItemStartTime(Date.now());
  }, [current]);

  const handleRate = (val) => {
    if (transitioning) return;
    const rt = Date.now() - itemStartTime;
    const result = {
      itemId: item.id,
      phenomenon: item.phenomenon,
      condition: item.condition,
      rating: val,
      rt: rt,
      timestamp: new Date().toISOString()
    };

    const newResults = [...results, result];
    setRating(val);
    setTransitioning(true);

    // Brief pause so participant sees selection, then advance
    setTimeout(() => {
      if (current + 1 >= items.length) {
        onComplete(newResults);
      } else {
        setResults(newResults);
        setCurrent(c => c + 1);
        setRating(null);
        setTransitioning(false);
      }
    }, 400);
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="max-w-lg w-full bg-white rounded-2xl shadow-sm p-6 sm:p-8">
        <ProgressBar current={current + 1} total={items.length} label={`Πείραμα ${experiment}`} />

        <div key={current} className="fade-in">
          <SentenceDisplay sentence={item.sentence} context={item.context} isExpB={isExpB} />
        </div>

        <div className="mt-2 text-center text-sm text-gray-500">
          {isExpB
            ? 'Πόσο αποδεκτή σας φαίνεται αυτή η ερμηνεία;'
            : 'Πόσο φυσική σας ακούγεται η πρόταση;'}
        </div>

        <RatingScale value={rating} onChange={handleRate} lowLabel={lowLabel} highLabel={highLabel} />
      </div>
    </div>
  );
}

// ----- End Screen -----
function EndScreen({ results, demographics, experiment }) {
  const [showJSON, setShowJSON] = useState(false);
  const [submitStatus, setSubmitStatus] = useState('sending'); // 'sending', 'success', 'error'
  const csvData = useMemo(() => resultsToCSV(results, demographics, experiment), [results, demographics, experiment]);
  const jsonData = useMemo(() => JSON.stringify({ demographics, experiment, results }, null, 2), [results, demographics, experiment]);

  // Auto-submit to Google Sheets
  useEffect(() => {
    submitToSheets(results, demographics, experiment).then(ok => {
      setSubmitStatus(ok ? 'success' : 'error');
    });
  }, [results, demographics, experiment]);

  // Also save to localStorage as backup
  useEffect(() => {
    const key = `linguaOYXOY_${experiment}_${demographics.participantId}`;
    try {
      localStorage.setItem(key, jsonData);
    } catch (e) {
      console.warn('Could not save to localStorage:', e);
    }
  }, [jsonData, experiment, demographics.participantId]);

  const handleDownloadCSV = () => {
    const filename = `experiment_${experiment}_${demographics.participantId}.csv`;
    downloadCSV(csvData, filename);
  };

  const handleCopyJSON = () => {
    navigator.clipboard.writeText(jsonData).then(() => {
      alert('Τα δεδομένα αντιγράφηκαν!');
    }).catch(() => {
      // fallback: select the textarea
      const ta = document.getElementById('json-output');
      if (ta) { ta.select(); document.execCommand('copy'); }
    });
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4">
      <div className="max-w-lg w-full bg-white rounded-2xl shadow-sm p-6 sm:p-8 text-center">
        <div className="text-5xl mb-4">✓</div>
        <h2 className="text-2xl font-bold text-gray-800 mb-2">Ευχαριστούμε!</h2>
        {submitStatus === 'sending' && (
          <p className="text-blue-500 mb-6">Αποστολή δεδομένων...</p>
        )}
        {submitStatus === 'success' && (
          <p className="text-green-600 mb-6">Οι απαντήσεις σας καταγράφηκαν επιτυχώς.</p>
        )}
        {submitStatus === 'error' && (
          <div className="mb-6">
            <p className="text-red-600 mb-2">Η αυτόματη αποστολή απέτυχε. Παρακαλώ επικοινωνήστε με τον υπεύθυνο.</p>
          </div>
        )}
        <p className="text-gray-500 mt-4">Μπορείτε να κλείσετε αυτή τη σελίδα.</p>
      </div>
    </div>
  );
}


// ========================
// MAIN APP
// ========================
function App() {
  // Phases: 'landing', 'demographics', 'instructions', 'practice', 'trial', 'end'
  // Check URL parameters: ?exp=a → Experiment A, ?exp=b → Experiment B
  const urlParams = new URLSearchParams(window.location.search);
  const expParam = urlParams.get('exp');
  const initialExp = expParam === 'a' ? 'A' : expParam === 'b' ? 'B' : null;

  const [phase, setPhase] = useState(initialExp ? 'demographics' : 'landing');
  const [experiment, setExperiment] = useState(initialExp); // 'A' or 'B'
  const [demographics, setDemographics] = useState(null);
  const [results, setResults] = useState(null);

  // Shuffled items (computed once demographics are set)
  const shuffledItems = useMemo(() => {
    if (!demographics || !experiment) return [];
    const items = experiment === 'A' ? EXPERIMENT_A_ITEMS : EXPERIMENT_B_ITEMS;
    const seed = hashString(demographics.participantId);
    return shuffleArray(items, seed);
  }, [demographics, experiment]);

  const practiceItems = experiment === 'A' ? EXPERIMENT_A_PRACTICE : EXPERIMENT_B_PRACTICE;

  const handleSelectExperiment = (exp) => {
    setExperiment(exp);
    setPhase('demographics');
  };

  const handleDemographics = (demo) => {
    setDemographics(demo);
    setPhase('instructions');
  };

  const handleInstructionsDone = () => {
    setPhase('practice');
  };

  const handlePracticeDone = () => {
    setPhase('trial');
  };

  const handleTrialComplete = (res) => {
    setResults(res);
    setPhase('end');
  };

  // Disable browser back button during trial
  useEffect(() => {
    if (phase === 'trial' || phase === 'practice') {
      const handler = (e) => {
        e.preventDefault();
        window.history.pushState(null, '', window.location.href);
      };
      window.history.pushState(null, '', window.location.href);
      window.addEventListener('popstate', handler);
      return () => window.removeEventListener('popstate', handler);
    }
  }, [phase]);

  switch (phase) {
    case 'landing':
      return <LandingPage onSelect={handleSelectExperiment} />;
    case 'demographics':
      return <DemographicsForm onSubmit={handleDemographics} />;
    case 'instructions':
      return <InstructionsScreen experiment={experiment} onContinue={handleInstructionsDone} />;
    case 'practice':
      return <PracticeScreen items={practiceItems} experiment={experiment} onComplete={handlePracticeDone} />;
    case 'trial':
      return <TrialScreen items={shuffledItems} experiment={experiment} demographics={demographics} onComplete={handleTrialComplete} />;
    case 'end':
      return <EndScreen results={results} demographics={demographics} experiment={experiment} />;
    default:
      return <LandingPage onSelect={handleSelectExperiment} />;
  }
}

// Mount
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
